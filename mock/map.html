<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エンジニア人生 全図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1+Code:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* トークンは index.html と同じ(レガシー案件の色だけ追加) */
  :root {
    --desk: #e4e8da; --panel: #fbfcf5; --panel-2: #eef1e4;
    --frame: #2d5a43; --ink: #1b2620; --muted: #66756b; --title: #7a4e00;
    --sel: #2d5a43; --sel-ink: #fbfcf5; --drop: #c3cab4;
    --bar: #2d5a43; --bar-ink: #fbfcf5;
    --job: #8fdcaa; --fire: #ffaa9e; --study: #a9c9ff; --change: #dcb6ff; --event: #ffdb70; --legacy: #d9b48c;
    --special: #1b2620; --tile-ink: #1b2620; --special-ink: #fbfcf5;
    --t-red: #b3261e; --t-green: #1d7a46; --t-magenta: #7b3fb0; --t-cyan: #0b6f86;
    --water: #8fbde0; --water-line: #3f7fae;
    --p1: #c2347a; --p2: #0b7f95; --p3: #4f8a0b; --p4: #c46a0a;
    --dot: "DotGothic16", "M PLUS 1 Code", monospace;
    font-family: "M PLUS 1 Code", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #0b1a3d; --panel: #17357f; --panel-2: #11295f;
      --frame: #9cd6ff; --ink: #eef3ff; --muted: #9fb0d6; --title: #ffe066;
      --sel: #9cd6ff; --sel-ink: #0b1a3d; --drop: #050c1e;
      --bar: #c8d2ea; --bar-ink: #0b1a3d;
      --job: #4fd27a; --fire: #ff6b5e; --study: #8cc4ff; --change: #d99bff; --event: #ffd84d; --legacy: #d7a676;
      --special: #f2f4fa; --tile-ink: #0b1a3d; --special-ink: #0b1a3d;
      --t-red: #ff9a90; --t-green: #7ee6a0; --t-magenta: #e6b8ff; --t-cyan: #9cd6ff;
      --water: #2a5fb8; --water-line: #8cc4ff;
      --p1: #ff8fc7; --p2: #7ef0ff; --p3: #c4f27a; --p4: #ffb766;
    }
  }
  :root[data-theme="dark"] {
    --desk: #0b1a3d; --panel: #17357f; --panel-2: #11295f;
    --frame: #9cd6ff; --ink: #eef3ff; --muted: #9fb0d6; --title: #ffe066;
    --sel: #9cd6ff; --sel-ink: #0b1a3d; --drop: #050c1e;
    --bar: #c8d2ea; --bar-ink: #0b1a3d;
    --job: #4fd27a; --fire: #ff6b5e; --study: #8cc4ff; --change: #d99bff; --event: #ffd84d; --legacy: #d7a676;
    --special: #f2f4fa; --tile-ink: #0b1a3d; --special-ink: #0b1a3d;
    --t-red: #ff9a90; --t-green: #7ee6a0; --t-magenta: #e6b8ff; --t-cyan: #9cd6ff;
    --water: #2a5fb8; --water-line: #8cc4ff;
    --p1: #ff8fc7; --p2: #7ef0ff; --p3: #c4f27a; --p4: #ffb766;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--ink); font-size: 14px; line-height: 1.65;
    background: radial-gradient(circle, var(--panel-2) 1px, transparent 1.5px) 0 0 / 8px 8px, var(--desk);
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--title); outline-offset: 2px; }

  .page { max-width: 1560px; margin: 0 auto; padding: 28px 16px 40px; display: grid; gap: 22px; }
  .win { position: relative; min-width: 0; background: var(--panel); border: 4px double var(--frame); box-shadow: 8px 8px 0 var(--drop); }
  .win-t { position: absolute; top: -.85em; left: 50%; transform: translateX(-50%); margin: 0; padding: 0 1ch; background: var(--panel); color: var(--title); font: 400 16px/1.4 var(--dot); white-space: nowrap; }
  .win-b { padding: 20px 18px 16px; }
  .btn { border: 0; padding: 7px 16px; cursor: pointer; font-weight: 700; background: var(--title); color: var(--sel-ink); box-shadow: 4px 4px 0 var(--drop); white-space: nowrap; }
  .btn.sub { background: var(--bar); color: var(--bar-ink); }
  .btn:active { transform: translate(4px, 4px); box-shadow: none; }
  .btn:disabled { opacity: .55; cursor: wait; }

  /* ---------- 地図 ---------- */
  .map-scroll { overflow-x: auto; padding: 0 10px 10px 0; }
  .map {
    position: relative; min-width: 940px; aspect-ratio: 1400 / 900; container-type: inline-size;
    background: var(--panel-2); border: 4px double var(--frame); box-shadow: 6px 6px 0 var(--drop);
  }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .grid line { stroke: var(--frame); stroke-opacity: .1; }
  .grid text { fill: var(--muted); font: 12px "M PLUS 1 Code", monospace; }
  .region .edge { fill: none; stroke-width: 2; stroke-dasharray: 7 6; }
  .region.cur .edge { stroke: var(--title) !important; stroke-width: 3.5; stroke-dasharray: none; }
  .label text { font: 24px var(--dot); fill: var(--ink); }
  .label tspan { font: 13px "M PLUS 1 Code", monospace; fill: var(--muted); }
  .label.cur text { fill: var(--title); }
  .landmark text { font: 11px "M PLUS 1 Code", monospace; fill: var(--ink); paint-order: stroke; stroke: var(--panel-2); stroke-width: 3px; }
  .water { fill: none; stroke: var(--water); stroke-linecap: round; }
  .water-line { fill: none; stroke: var(--water-line); stroke-width: 1.5; stroke-dasharray: 6 10; }
  .sea { fill: var(--water); }
  .roads path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .roads .edge { stroke: var(--frame); stroke-width: 20; }
  .roads .base { stroke: var(--panel); stroke-width: 12; }
  .roads .dash { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 2 9; }
  .roads .rail { stroke: var(--ink); stroke-width: 32; stroke-linecap: butt; }
  .roads .deck { stroke: var(--bar); stroke-width: 27; stroke-linecap: butt; }
  .roads .plank { stroke: var(--muted); stroke-width: 27; stroke-dasharray: 1.5 6; stroke-linecap: butt; opacity: .6; }
  .gate .post { fill: var(--t-red); }
  .gate .beam { stroke: var(--t-red); stroke-width: 5; }
  .gate text, .sign text { font: 12px var(--dot); fill: var(--ink); }
  .gate rect.plate, .sign rect.plate { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
  .sign .pole { stroke: var(--muted); stroke-width: 3; }
  .cartouche .box { fill: var(--panel); stroke: var(--frame); stroke-width: 2; }
  .cartouche .box2 { fill: none; stroke: var(--frame); stroke-width: 1; }
  .cartouche .t { font: 32px var(--dot); fill: var(--ink); }
  .cartouche .s { font: 13px "M PLUS 1 Code", monospace; fill: var(--muted); }
  .cartouche .n { font: 18px var(--dot); fill: var(--ink); }
  .legend text { font: 12px "M PLUS 1 Code", monospace; fill: var(--ink); }
  .legend .h { font: 16px var(--dot); }

  .tile {
    position: absolute; z-index: 2; width: 2.9%; aspect-ratio: 1 / 1; transform: translate(-50%, -50%);
    display: grid; place-items: center; background: var(--c); color: var(--tile-ink); cursor: help;
    box-shadow: 3px 3px 0 var(--drop); font: 400 1.05cqw/1 var(--dot);
  }
  .tile.special { width: 3.4%; background: var(--special); color: var(--special-ink); box-shadow: 3px 3px 0 var(--drop), 0 0 0 2px var(--panel-2), 0 0 0 4px var(--special); }
  .tile.t-ai { background: repeating-linear-gradient(45deg, var(--change) 0 5px, color-mix(in srgb, var(--change) 65%, var(--panel)) 5px 10px); color: var(--tile-ink); box-shadow: 3px 3px 0 var(--drop), 0 0 0 2px var(--panel-2), 0 0 0 4px var(--change); }
  .tile.t-goal { background: repeating-conic-gradient(var(--special) 0 25%, var(--special-ink) 0 50%) 0 0 / 10px 10px; }
  .tile.t-goal span { background: var(--special); color: var(--special-ink); padding: 0 3px; }
  .tile.t-legacy { box-shadow: 3px 3px 0 var(--drop), inset 0 0 0 2px color-mix(in srgb, var(--tile-ink) 45%, transparent); }
  .tile.passed::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, var(--panel) 1px, transparent 1.4px) 0 0 / 5px 5px; opacity: .65; }
  .tile .no { position: absolute; top: -1.05cqw; left: 0; font: 400 .72cqw/1 "M PLUS 1 Code", monospace; color: var(--muted); }
  .tile:hover, .tile.on { outline: 2px solid var(--title); outline-offset: 2px; z-index: 5; }

  .pieces { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  /* 地図ピン: 先端がマスの中心を指す */
  .piece {
    position: absolute; width: 44px; height: 57px; margin: -57px 0 0 -22px;
    transition: left .2s steps(2), top .2s steps(2), transform .15s;
    filter: drop-shadow(3px 3px 0 var(--drop));
  }
  .piece .head {
    position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; background: var(--pc); color: var(--sel-ink);
    border: 3px solid var(--ink); font: 400 22px/1 var(--dot);
  }
  .piece .tip-end {
    position: absolute; left: 50%; top: 39px; transform: translateX(-50%);
    border: 11px solid transparent; border-top: 18px solid var(--ink); border-bottom: 0;
  }
  .piece .name {
    position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); white-space: nowrap;
    padding: 1px 7px; font: 700 12px/1.5 "M PLUS 1 Code", monospace;
    background: var(--ink); color: var(--panel);
  }
  .piece.turn { z-index: 10 !important; }
  .piece.turn .name { background: var(--title); color: var(--sel-ink); }
  .piece.turn .head { animation: bob 1s steps(2) infinite; }
  .piece.hop { animation: hop .2s steps(2); }
  .piece.rest .head { opacity: .6; }
  .piece.rest .name::after { content: " 休職中"; color: var(--t-red); }
  .piece.focus { transform: scale(1.3); z-index: 11 !important; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  @keyframes hop { 50% { transform: translateY(-14px); } }

  .tip {
    position: absolute; z-index: 10; pointer-events: none; display: none; min-width: 190px; max-width: 260px;
    padding: 8px 10px; background: var(--panel); border: 3px double var(--frame); box-shadow: 4px 4px 0 var(--drop);
    font-size: 12px; line-height: 1.55;
  }
  .tip.show { display: block; }
  .tip b { font: 400 16px/1.3 var(--dot); display: block; }
  .tip .m { color: var(--muted); }


  /* ---------- ステータス(index.html と同じ部品) ---------- */
  .muted { color: var(--muted); } .red { color: var(--t-red); } .green { color: var(--t-green); } .magenta { color: var(--t-magenta); }
  .menubar { display: flex; flex-wrap: wrap; gap: 0 22px; align-items: center; padding: 4px 14px; background: var(--bar); color: var(--bar-ink); font-size: 13px; }
  .menubar .era { font: 400 15px/1.6 var(--dot); }
  .menubar .sp { flex: 1; }
  .meters { display: grid; grid-template-columns: repeat(3, max-content); justify-content: space-between; gap: 2px 32px; }
  .mrow { display: grid; grid-template-columns: 7.5em max-content 3em 2.5em; justify-content: start; gap: 12px; align-items: center; white-space: nowrap; }
  .mrow .bar { overflow: hidden; letter-spacing: -.04em; }
  .mrow .v, .mrow .d { text-align: right; }
  .mrow .d { font-weight: 700; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
  .main > .win > .win-b { padding: 20px 12px 12px; }
  .pl { padding: 8px 16px 10px; }
  .pl + .pl { border-top: 1px solid color-mix(in srgb, var(--frame) 35%, transparent); }
  .pl.turn { background: color-mix(in srgb, var(--sel) 16%, var(--panel)); }
  .pl.resting { opacity: .6; }
  .pl-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .pl-head .chip { width: 22px; height: 22px; display: grid; place-items: center; font: 400 13px/1 var(--dot); background: var(--pc); color: var(--sel-ink); flex: none; }
  .pl-head .name { font: 400 16px/1.3 var(--dot); }
  .pl-head .route { font-size: 11px; color: var(--muted); }
  .pl-head .state { margin-left: auto; font-size: 11px; font-weight: 700; padding: 0 6px; white-space: nowrap; }
  .pl.turn .state { background: var(--title); color: var(--sel-ink); }
  .pl .mrow { grid-template-columns: 4.5em max-content 4.5em; gap: 8px; font-size: 12px; }
  .pl .where { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .stack { font-size: 11px; color: var(--muted); }
  .stack span { color: var(--ink); }
  .flash { animation: flash .6s steps(2) 2; }
  @keyframes flash { 50% { background: color-mix(in srgb, var(--title) 35%, transparent); } }

  .bottom { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 22px; align-items: stretch; }
  .win.focus { border-color: var(--title); }
  .act { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px 22px; align-items: center; }
  .die {
    width: 64px; height: 64px; padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    background: #f7f7f2; box-shadow: 5px 5px 0 var(--drop);
  }
  .die i { width: 10px; height: 10px; place-self: center; background: #10141c; visibility: hidden; }
  .die i.on { visibility: visible; }
  .die.one i.on { width: 14px; height: 14px; background: #d6342b; }
  .die.rolling { animation: tumble .24s steps(2) infinite; }
  @keyframes tumble { 50% { transform: translate(-3px, -6px) rotate(-8deg); } }
  .prompt { overflow-wrap: anywhere; }
  .prompt .ps { color: var(--t-green); font-weight: 700; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .hand { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 12px; }
  .check { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
  .check::before { content: "[ ] "; color: var(--muted); }
  .check.on::before { content: "[x] "; color: var(--title); }
  .check b { color: var(--t-magenta); }
  .key { display: inline-block; padding: 0 5px; margin-left: 6px; font-size: 11px; font-weight: 500; border: 1px solid currentColor; opacity: .75; }

  .log { font-size: 12px; max-height: 168px; overflow: auto; }
  .log div { display: grid; grid-template-columns: 4ch 6.5ch minmax(0, 1fr); gap: 10px; line-height: 23px; }
  .lv { font-weight: 700; text-align: center; color: var(--tile-ink); align-self: center; line-height: 17px; }
  .lv.error { background: var(--fire); } .lv.warn { background: var(--event); }
  .lv.ai { background: var(--change); } .lv.info { background: var(--study); } .lv.money { background: var(--legacy); }

  .overlay { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; padding: 20px; background: color-mix(in srgb, var(--desk) 70%, transparent); }
  .overlay.open { display: grid; }
  .overlay .win { width: min(460px, 100%); border-color: var(--title); animation: open .18s steps(3); }
  @keyframes open { from { transform: scale(.9); opacity: 0; } }
  .card-name { margin: 0 0 8px; font: 400 30px/1.25 var(--dot); }
  .card-text { margin: 0 0 16px; }
  .diff { font-size: 13px; background: var(--panel-2); padding: 6px 0; }
  .diff div { padding: 0 12px; white-space: pre; overflow-x: auto; }
  .diff .hunk { color: var(--muted); }
  .diff .del { color: var(--t-red); }
  .diff .add { color: var(--t-green); }
  .card-actions { display: flex; justify-content: flex-end; margin-top: 18px; }

  @media (max-width: 1180px) {
    .main, .bottom { grid-template-columns: minmax(0, 1fr); }
    .players-b { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); }
    .pl + .pl { border-top: 0; }
    .meters { grid-template-columns: repeat(2, max-content); justify-content: start; }
  }
  @media (max-width: 700px) {
    .meters { grid-template-columns: minmax(0, 1fr); }
    .mrow { grid-template-columns: 6.5em max-content 2.8em 2.2em; gap: 8px; font-size: 12px; }
    .act { grid-template-columns: auto minmax(0, 1fr); }
    .hand, .act > .btn { grid-column: 1 / -1; }
    .act > .btn { justify-self: start; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="menubar">
    <span class="era" id="eraName"></span>
    <span id="eraBar"></span>
    <span class="sp"></span>
    <span id="turnNo"></span>
    <span>部屋 K7QX</span>
    <span>4人</span>
  </div>

  <section class="win">
    <h2 class="win-t">技術の人気度</h2>
    <div class="win-b meters" id="trend"></div>
  </section>

  <div class="main">
    <section class="win">
      <h2 class="win-t">エンジニア人生 全図</h2>
      <div class="win-b">
        <div class="map-scroll">
          <div class="map" id="map">
            <svg id="svg" viewBox="0 0 1400 900" aria-hidden="true"></svg>
            <div id="tiles"></div>
            <div class="pieces" id="pieces"></div>
            <div class="tip" id="tip"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="win">
      <h2 class="win-t">プレイヤー</h2>
      <div class="players-b" id="players" style="padding-top:10px"></div>
    </section>
  </div>

  <div class="bottom">
    <section class="win focus">
      <h2 class="win-t">あなたの番</h2>
      <div class="win-b act">
        <div class="die" id="dice" aria-label="サイコロ"></div>
        <div>
          <div class="prompt"><span class="ps">you@life</span>:~/<span id="cwd">ai-lab</span>$ <span id="cmd">./roll</span></div>
          <div class="hint">AIペアプロを使うと出た目に +2。ただし、その回はスキルが伸びません。</div>
        </div>
        <button class="btn" id="roll">サイコロを振る<span class="key">Enter</span></button>
        <div class="hand">
          <button class="check" id="aiCard"><b>AIペアプロ</b> を使う</button>
          <span class="muted">止まったマスの効果は、ステータスとログにすぐ反映されます</span>
        </div>
      </div>
    </section>

    <section class="win">
      <h2 class="win-t">ログ</h2>
      <div class="win-b log" id="log">
        <div><span class="muted">T14</span><span class="lv error">ERROR</span><span><b style="color:var(--p2)">ミナミ</b> が炎上マスに止まった。メンタル −2、評判 +1</span></div>
        <div><span class="muted">T14</span><span class="lv warn">WARN</span><span><b style="color:var(--p4)">ユイ</b> は休職中。あと1回休み</span></div>
        <div><span class="muted">T13</span><span class="lv ai">AI</span><span>AI研究所に入り、AI が登場した。これから AI カードが手に入る</span></div>
      </div>
    </section>
  </div>
</div>

<div class="overlay" id="overlay">
  <section class="win" role="dialog" aria-labelledby="cardName">
    <h2 class="win-t">流行カード</h2>
    <div class="win-b">
      <h3 class="card-name" id="cardName"></h3>
      <p class="card-text" id="cardText"></p>
      <div class="diff" id="cardDiff"></div>
      <div class="card-actions"><button class="btn" id="closeCard">閉じる<span class="key">Esc</span></button></div>
    </div>
  </section>
</div>

<script>
  const W = 1400, H = 900;
  const PER_ERA = 18;  // 1マス = 4か月

  // ---- マスとデータ ----
  const TYPES = {
    job:    { g: "¥+",  nm: "案件",         c: "job",    fx: "お金とスキルが増える。持っている技術の人気度で報酬が変わる" },
    fire:   { g: "!!",  nm: "炎上",         c: "fire",   fx: "メンタルが減る。乗り切ると評判が上がる" },
    study:  { g: "{}",  nm: "勉強",         c: "study",  fx: "お金を払ってスキルを上げる。新しい技術を覚えられる" },
    change: { g: "⇄",   nm: "転職",         c: "change", fx: "別のルートに移れる。評判が高いほど良い会社に入れる" },
    event:  { g: "??",  nm: "イベント",     c: "event",  fx: "イベントカードを1枚引く" },
    legacy: { g: "$$",  nm: "レガシー案件", c: "legacy", fx: "古いシステムを持っている人だけ大もうけ。持っていなければ何も起きない" },
    start:  { g: ">_",  nm: "ふりだし",     c: "special", special: true, fx: "新卒で入社。ここから30年が始まる" },
    ai:     { g: "AI",  nm: "AI登場",       c: "change",  special: true, fx: "必ず止まる。ここから AI カードが手に入るようになる" },
    branch: { g: "├┬",  nm: "分かれ道",     c: "special", special: true, fx: "マネージャー / スペシャリスト / フリーランス / 起業 から道を選ぶ" },

    $("#pieces").innerHTML = PLAYERS.map((p, k) =>
      `<div class="piece ${p.turn ? "turn" : ""} ${p.resting ? "rest" : ""}" data-p="${k}" style="--pc:var(${p.c})">
        <span class="tip-end"></span><span class="head">${p.nm[0]}</span><span class="name">${p.nm}</span></div>`).join("");
  }

  function update() {
    document.querySelectorAll(".tile").forEach(t => t.classList.toggle("passed", +t.dataset.i < me().pos));
    document.querySelectorAll(".piece").forEach(el => {
      const p = PLAYERS[+el.dataset.p];
      const same = PLAYERS.filter(q => q.pos === p.pos);
      const k = same.indexOf(p), n = same.length;
      const [x, y] = PTS[p.pos];
      el.style.left = `calc(${x / W * 100}% + ${(k - (n - 1) / 2) * 46}px)`;
      el.style.top = `${y / H * 100}%`;
      el.style.zIndex = k + 1;
    });
    renderPlayers();
    renderHeader();
  }

  // ---- マスの説明 ----
  function showTip(tile) {
    const i = +tile.dataset.i, t = TYPES[typeAt(i)], e = eraOf(i);
    const tip = $("#tip"), map = $("#map").getBoundingClientRect(), r = tile.getBoundingClientRect();
    const here = PLAYERS.filter(p => p.pos === i).map(p => p.nm).join("、");
    tip.innerHTML = `<b>${t.nm}</b><div class="m">${i + 1}マス目 / ${ERAS[e].place}(時代${e + 1})/ ${yearOf(i)}年目</div><div>${t.fx}</div>${here ? `<div class="m">ここにいる人: ${here}</div>` : ""}`;
    tip.classList.add("show");
    const left = Math.min(r.right - map.left + 10, map.width - tip.offsetWidth - 8);
    tip.style.left = left + "px";
    tip.style.top = Math.max(8, r.top - map.top - tip.offsetHeight - 10) + "px";
  }
  const hideTip = () => $("#tip").classList.remove("show");

  // ---- 起動 ----
  function start() {
    build();
    update();
    document.querySelectorAll(".tile").forEach(t => {
      t.addEventListener("mouseenter", () => showTip(t));
      t.addEventListener("focus", () => showTip(t));
      t.addEventListener("mouseleave", hideTip);
      t.addEventListener("blur", hideTip);
    });
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(start);
  $("#players").addEventListener("mouseover", e => {
    const pl = e.target.closest(".pl");
    document.querySelectorAll(".piece").forEach(el => el.classList.toggle("focus", !!pl && el.dataset.p === pl.dataset.p));
  });
  $("#players").addEventListener("mouseleave", () => document.querySelectorAll(".piece.focus").forEach(el => el.classList.remove("focus")));

  // ---- ステータスの描画 ----
  function blocks(val, max, cells, color) {
    const n = Math.max(0, Math.min(cells, Math.round(val / max * cells)));
    return `<span style="color:${color}">${"█".repeat(n)}</span><span class="muted" style="opacity:.5">${"░".repeat(cells - n)}</span>`;
  }
  function renderTrend() {
    const lvColor = (v) => v >= 4 ? "var(--t-green)" : v >= 3 ? "var(--title)" : "var(--t-red)";
    $("#trend").innerHTML = TECHS.map(t => `
      <div class="mrow">
        <span>${t.nm}</span>
        <span class="bar">${blocks(t.v, 5, 15, lvColor(t.v))}</span>
        <span class="v">${t.v}/5</span>
        <span class="d ${t.d > 0 ? "green" : t.d < 0 ? "red" : "muted"}">${t.d > 0 ? "▲" + t.d : t.d < 0 ? "▼" + -t.d : "−"}</span>
      </div>`).join("") + `
      <div class="mrow"><span class="magenta">AIの進化</span><span class="bar">${blocks(1, 3, 15, "var(--t-magenta)")}</span><span class="v">Lv1</span><span></span></div>`;
  }
  function renderHeader() {
    const e = eraOf(me().pos);
    $("#eraName").textContent = `時代 ${e + 1}/5 ${ERAS[e].place}(${ERAS[e].name})`;
    $("#eraBar").textContent = ERAS.map((_, i) => i < e ? "■" : i === e ? "▣" : "□").join("");
    $("#turnNo").textContent = `ターン ${turn}`;
    $("#cwd").textContent = ["training", "client-town", "ai-lab", "tech-mountains", "port"][e];
  }
  function renderPlayers() {
    const row = (k, val, max, text, color) =>
      `<div class="mrow"><span class="muted">${k}</span><span class="bar">${blocks(val, max, 12, color)}</span><span class="v">${text}</span></div>`;
    $("#players").innerHTML = PLAYERS.map((p, k) => {
      const e = eraOf(p.pos);
      return `<div class="pl ${p.turn ? "turn" : ""} ${p.resting ? "resting" : ""}" data-p="${k}">
        <div class="pl-head">
          <span class="chip" style="--pc:var(${p.c})">${p.nm[0]}</span>
          <span><span class="name">${p.nm}</span> <span class="route">${p.route}</span></span>
          <span class="state ${p.resting ? "red" : "muted"}">${p.turn ? "手番" : p.resting ? "休職中" : ""}</span>
        </div>
        <div class="where">${p.pos + 1}/${TOTAL}マス目 ${ERAS[e].place} ${yearOf(p.pos)}年目</div>
        ${row("お金", p.money, 800, p.money + "万", "var(--title)")}
        ${row("スキル", p.skill, 30, p.skill, "var(--t-cyan)")}
        ${row("メンタル", p.mental, 10, p.mental + "/10", p.mental <= 3 ? "var(--t-red)" : "var(--t-green)")}
        ${row("評判", p.rep, 20, p.rep, "var(--t-magenta)")}
        <div class="stack">技術: <span>${p.techs.join(", ")}</span></div>
      </div>`;
    }).join("");
  }

  // ---- マスの効果(モック用のざっくりした数値) ----
  const trendOf = (nm) => TECHS.find(t => t.nm === nm).v;
  function applySquare(p, type, usedAi) {
    const best = Math.max(...p.techs.map(trendOf));
    switch (type) {
      case "job": {
        const pay = 20 + best * 10;
        p.money += pay; if (!usedAi) p.skill += 1;
        return ["info", `案件をこなした。お金 +${pay}万${usedAi ? "(AIで楽をしたのでスキルは据え置き)" : "、スキル +1"}`];
      }
      case "fire":
        p.mental = Math.max(0, p.mental - 2); p.rep += 1;
        return ["error", "炎上案件に巻き込まれた。メンタル −2、乗り切って評判 +1"];
      case "study":
        p.money -= 30; if (!usedAi) p.skill += 2;
        return ["info", `勉強会に参加。お金 −30万${usedAi ? "" : "、スキル +2"}`];
      case "change":
        p.rep += 1;
        return ["info", "転職の誘いが来た。評判 +1(ルート変更は未実装)"];
      case "legacy":
        if (p.techs.includes("古いシステム")) { p.money += 150; return ["money", "誰も触れない古いシステムの案件。お金 +150万"]; }
        return ["warn", "レガシー案件だが、古いシステムが分からず何もできなかった"];
      case "event":
        return ["warn", "イベントマス。流行カードをめくった"];
      case "branch":
        return ["ai", "分かれ道。今回はスペシャリストの道を進む"];
      case "goal":
        return ["info", "定年。お疲れさまでした"];
      default:
        return ["info", TYPES[type].nm + "に止まった"];
    }
  }
  function addLog(level, text) {
    $("#log").insertAdjacentHTML("afterbegin",
      `<div><span class="muted">T${turn}</span><span class="lv ${level}">${level === "money" ? "$$$" : level.toUpperCase()}</span><span><b style="color:var(--p1)">あなた</b>: ${text}</span></div>`);
  }

  // ---- 流行カード ----
  function openCard() {
    const card = TREND_CARDS[Math.floor(Math.random() * TREND_CARDS.length)];
    let diff = `<div class="hunk">@@ trend.yml @@</div>`;
    card.fx.forEach(([nm, d]) => {
      const t = TECHS.find(x => x.nm === nm);
      const before = t.v;
      t.v = Math.max(1, Math.min(5, t.v + d)); t.d = t.v - before;
      const pad = (str) => str + " ".repeat(Math.max(1, 8 - str.length * 2));
      diff += `<div class="del">- ${pad(nm + ":")}${before}</div><div class="add">+ ${pad(nm + ":")}${t.v}</div>`;
    });
    $("#cardName").textContent = card.nm;
    $("#cardText").textContent = card.text;
    $("#cardDiff").innerHTML = diff;
    $("#overlay").classList.add("open");
    $("#closeCard").focus();
    renderTrend();
  }
  const closeCard = () => $("#overlay").classList.remove("open");
  $("#closeCard").addEventListener("click", closeCard);

  // ---- サイコロ ----
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  function setDie(n) {
    const die = $("#dice");
    die.classList.toggle("one", n === 1);
    die.setAttribute("aria-label", `サイコロ: ${n}`);
    die.innerHTML = Array.from({ length: 9 }, (_, i) => `<i class="${PIPS[n].includes(i) ? "on" : ""}"></i>`).join("");
  }
  setDie(5);
  renderTrend();

  $("#aiCard").addEventListener("click", e => {
    const on = e.currentTarget.classList.toggle("on");
    $("#cmd").textContent = on ? "./roll --ai-pair" : "./roll";
  });

  let rolling = false;
  async function roll() {
    if (rolling || me().pos >= TOTAL - 1) return;
    rolling = true;
    $("#roll").disabled = true;
    const die = $("#dice");
    die.classList.add("rolling");
    const timer = setInterval(() => setDie(1 + Math.floor(Math.random() * 6)), 80);
    await sleep(900);
    clearInterval(timer);
    die.classList.remove("rolling");
    const n = 1 + Math.floor(Math.random() * 6);
    const usedAi = $("#aiCard").classList.contains("on");
    setDie(n);
    await sleep(250);

    const piece = document.querySelector('.piece[data-p="0"]');
    piece.classList.remove("turn");
    for (let s = 0; s < n + (usedAi ? 2 : 0) && me().pos < TOTAL - 1; s++) {
      me().pos++;
      piece.classList.remove("hop"); void piece.offsetWidth; piece.classList.add("hop");
      update();
      await sleep(240);
    }
    piece.classList.add("turn");

    const type = typeAt(me().pos);
    const [level, text] = applySquare(me(), type, usedAi);
    turn++;
    addLog(level, `${n}${usedAi ? "+2" : ""} 進んで ${me().pos + 1}マス目(${TYPES[type].nm})。${text}`);
    update();
    document.querySelector('.pl[data-p="0"]').classList.add("flash");
    if (usedAi) { $("#aiCard").classList.remove("on"); $("#cmd").textContent = "./roll"; }
    $("#roll").disabled = false;
    rolling = false;
    if (type === "event") { await sleep(400); openCard(); }
  }
  $("#roll").addEventListener("click", roll);

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") return closeCard();
    if (e.key === "Enter" && !$("#overlay").classList.contains("open") && e.target.tagName !== "BUTTON") { e.preventDefault(); roll(); }
    if (e.key.toLowerCase() !== "t") return;
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  });
</script>
</body>
</html>
